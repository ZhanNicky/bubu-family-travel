<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17241f">
  <title>布布一家｜旅行档案</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      color: #f7f2e8;
      background:
        radial-gradient(circle at 82% 12%, rgba(218, 167, 91, .24), transparent 28rem),
        linear-gradient(145deg, #17241f 0%, #243b32 58%, #70533a 150%);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0 56px; }
    .eyebrow { margin: 0 0 12px; color: #e6bd7a; font-size: 13px; letter-spacing: .18em; }
    h1 { margin: 0; max-width: 720px; font-family: Georgia, "Songti SC", serif; font-size: clamp(42px, 8vw, 88px); line-height: 1.02; font-weight: 500; }
    .intro { margin: 22px 0 54px; max-width: 560px; color: rgba(255,255,255,.7); font-size: 17px; line-height: 1.8; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
    .trip {
      grid-column: span 8;
      min-height: 370px;
      padding: 34px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #17241f;
      text-decoration: none;
      border-radius: 28px;
      background: linear-gradient(150deg, #f2d19d, #d79c58);
      box-shadow: 0 28px 70px rgba(0,0,0,.22);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .trip:hover { transform: translateY(-5px); box-shadow: 0 34px 82px rgba(0,0,0,.28); }
    .trip small { font-size: 13px; letter-spacing: .12em; }
    .trip h2 { margin: 0; max-width: 560px; font-family: Georgia, "Songti SC", serif; font-size: clamp(36px, 6vw, 68px); line-height: 1.08; font-weight: 500; }
    .meta { display: flex; justify-content: space-between; gap: 20px; align-items: end; }
    .meta p { margin: 0; line-height: 1.65; }
    .arrow { width: 52px; height: 52px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid rgba(23,36,31,.35); border-radius: 50%; font-size: 24px; }
    .note {
      grid-column: span 4;
      min-height: 370px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 28px;
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(14px);
    }
    .note b { font-family: Georgia, "Songti SC", serif; font-size: 28px; font-weight: 500; }
    .note p { margin: 14px 0 0; color: rgba(255,255,255,.62); line-height: 1.7; }
    footer { margin-top: 48px; color: rgba(255,255,255,.4); font-size: 13px; }
    @media (max-width: 760px) {
      main { width: min(100% - 24px, 620px); padding-top: 44px; }
      .intro { margin-bottom: 34px; }
      .trip, .note { grid-column: 1 / -1; min-height: 330px; padding: 26px; border-radius: 22px; }
      .note { min-height: 210px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">BUBU FAMILY · TRAVEL NOTES</p>
    <h1>布布一家的<br>旅行档案</h1>
    <p class="intro">把走过的路、住过的地方和一家人的快乐，慢慢收在这里。</p>

    <section class="grid" aria-label="旅行列表">
      <a class="trip" href="./trips/ningxia-2026/">
        <small>2026 · 国庆假期</small>
        <h2>去宁夏看<br>沙漠和星空</h2>
        <div class="meta">
          <p>南昌 · 中卫 · 银川<br>8 天 7 晚</p>
          <span class="arrow" aria-hidden="true">↗</span>
        </div>
      </a>
      <aside class="note">
        <b>下一站，等我们出发。</b>
        <p>以后新增的旅行，会继续出现在这本家庭旅行档案里。</p>
      </aside>
    </section>

    <footer>布布一家 · 一起看更大的世界</footer>
  </main>
</body>
</html>
